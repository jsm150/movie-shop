spring:
  application:
    name: movie-shop
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 1000
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

app:
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      access-token-ttl: ${APP_SECURITY_JWT_ACCESS_TOKEN_TTL:PT1H}

